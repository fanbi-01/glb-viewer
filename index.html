<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>3Dモデルビューア</title>

  <!-- model-viewer本体 -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background-color: #eeeeee;
      font-family: sans-serif;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 400px;
      background-color: #eeeeee;
    }

    .loading-message {
      position: absolute;
      top: 16px;
      left: 16px;

      padding: 8px 12px;
      border-radius: 6px;

      background-color: rgba(255, 255, 255, 0.9);
      color: #333333;
    }

    .help {
      position: absolute;
      right: 16px;
      bottom: 16px;

      margin: 0;
      padding: 8px 12px;
      border-radius: 6px;

      background-color: rgba(255, 255, 255, 0.85);
      color: #333333;
      font-size: 13px;

      pointer-events: none;
    }
  </style>
</head>

<body>
  <model-viewer
    id="viewer"
    src="./model.glb"
    alt="3Dモデル"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    loading="eager"
    touch-action="pan-y">

    <div
      slot="poster"
      class="loading-message">
      3Dモデルを読み込んでいます……
    </div>
  </model-viewer>

  <p class="help">
    ドラッグ：回転 ／ ホイール：拡大・縮小
  </p>

  <script>
    const viewer = document.getElementById("viewer");

    viewer.addEventListener("load", () => {
      console.log("GLBの読み込みが完了しました。");
    });

    viewer.addEventListener("error", (event) => {
      console.error(
        "GLBの読み込みに失敗しました。",
        event
      );
    });
  </script>
</body>
</html>
